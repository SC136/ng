<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base64 · ng.foo.ng</title>
  <meta name="description" content="Encode and decode Base64 text and files in your browser, including URL-safe Base64 and data URLs.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script src="/assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <script type="module" src="/assets/shell.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div data-shell="header"></div>
  <main class="tool" id="main">
    <header class="tool-head">
      <p class="eyebrow"><a href="/tools/">Tools</a> / Encode &amp; decode</p>
      <h1>Base64</h1>
      <p class="lede">Encode text or files as Base64, or decode it back. Type on either side and the other side follows.</p>
    </header>

    <div class="row">
      <div class="seg" role="group" aria-label="What to encode" id="mode">
        <button type="button" data-value="text" aria-pressed="true">Text</button>
        <button type="button" data-value="file" aria-pressed="false">File</button>
      </div>
      <span class="spacer"></span>
      <label class="check"><input type="checkbox" id="urlsafe"> URL-safe (- and _)</label>
      <label class="check"><input type="checkbox" id="nopad"> No padding</label>
    </div>

    <section class="grid-2" id="text-mode" aria-label="Text">
      <div class="pane">
        <div class="pane-head">
          <label class="pane-title" for="plain">Text</label>
          <button class="btn sm" type="button" id="sample">Sample</button>
          <button class="btn sm" type="button" id="clear">Clear</button>
          <button class="btn sm" type="button" data-copy="#plain">Copy</button>
        </div>
        <div class="pane-body flush">
          <textarea id="plain" spellcheck="false" placeholder="Type or paste text to encode…"></textarea>
        </div>
        <div class="pane-foot"><span id="plain-info"></span></div>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label class="pane-title" for="encoded">Base64</label>
          <button class="btn sm" type="button" id="download" hidden>Download</button>
          <button class="btn sm" type="button" data-copy="#encoded">Copy</button>
        </div>
        <div class="pane-body flush">
          <textarea id="encoded" spellcheck="false" placeholder="…or paste Base64 or a data URL to decode"></textarea>
        </div>
        <div class="pane-foot"><span id="encoded-info"></span></div>
      </div>

      <p class="msg full" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="stack" id="file-mode" aria-label="File" hidden>
      <div class="dropzone" id="drop" aria-label="Choose a file to encode">
        <strong>Drop a file here</strong>
        <span class="hint">or click to choose one. Files up to 25 MB. They never leave your browser.</span>
      </div>
      <div class="pane" id="file-result" hidden>
        <div class="pane-head"><span class="pane-title">Encoded file</span></div>
        <div class="pane-body">
          <dl class="kv" id="file-meta"></dl>
          <div class="field">
            <label for="file-b64">Base64</label>
            <textarea id="file-b64" readonly rows="6" spellcheck="false"></textarea>
          </div>
          <div class="field">
            <label for="file-dataurl">Data URL</label>
            <textarea id="file-dataurl" readonly rows="4" spellcheck="false"></textarea>
          </div>
          <div class="row">
            <button class="btn sm" type="button" data-copy="#file-b64">Copy Base64</button>
            <button class="btn sm" type="button" data-copy="#file-dataurl">Copy data URL</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-shell="footer"></div>
</body>
</html>
