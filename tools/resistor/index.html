<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resistor · ng.foo.ng</title>
  <meta name="description" content="Read 4, 5 and 6 band resistor color codes, or find the bands for a value, with tolerance range and E-series.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script src="/assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <script type="module" src="/assets/shell.js"></script>
  <script type="module" src="./main.js"></script>
  <style>
    .band-pick { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 6px; }
    .band-pick legend { padding: 0; margin-bottom: 6px; font: 500 0.78rem/1.3 var(--font-ui); color: var(--ink-2); }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .pick {
      position: relative; display: inline-flex; align-items: center; gap: 6px;
      min-height: 32px; padding: 3px 8px 3px 4px;
      border: 1px solid var(--line); border-radius: 9px; background: var(--card);
      font-size: 0.8rem; color: var(--ink-2); cursor: pointer;
    }
    .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    .pick .swatch { width: 22px; height: 22px; border-radius: 6px; }
    .pick .swatch.none { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--line-2) 4px 6px); }
    .pick small { color: var(--ink-3); font-family: var(--font-mono); font-size: 0.72rem; }
    .pick:hover { border-color: var(--ink-3); color: var(--ink); }
    .pick:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); box-shadow: 0 0 0 1px var(--accent); }
    .pick:has(input:focus-visible) { outline: 2px solid var(--indigo); outline-offset: 2px; }
    .drawing svg { display: block; width: 100%; height: auto; }
    .drawing .lead { stroke: var(--ink-3); stroke-width: 4; stroke-linecap: round; }
    .drawing .body { stroke: var(--line-2); stroke-width: 1.5; }
    .drawing .band { stroke: rgba(0, 0, 0, 0.3); stroke-width: 1; }
    .result-value { font: 400 clamp(2rem, 6vw, 2.75rem)/1.05 var(--font-display); overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div data-shell="header"></div>
  <main class="tool" id="main">
    <header class="tool-head">
      <p class="eyebrow"><a href="/tools/">Tools</a> / Hardware &amp; bits</p>
      <h1>Resistor</h1>
      <p class="lede">Pick the color bands to read a resistor, or type a value to see which bands it needs.</p>
    </header>

    <div class="row">
      <div class="seg" role="group" aria-label="Direction" id="mode">
        <button type="button" data-value="read" aria-pressed="true">Read bands</button>
        <button type="button" data-value="find" aria-pressed="false">Find bands</button>
      </div>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Band count" id="count">
        <button type="button" data-value="4" aria-pressed="true">4 bands</button>
        <button type="button" data-value="5" aria-pressed="false">5 bands</button>
        <button type="button" data-value="6" aria-pressed="false">6 bands</button>
      </div>
    </div>

    <section class="grid-2">
      <div class="pane">
        <div class="pane-head"><span class="pane-title" id="input-title">Bands</span></div>
        <div class="pane-body">
          <div class="stack" id="pickers"></div>

          <div class="stack" id="find-panel" hidden>
            <label class="field">
              <span>Resistance</span>
              <input id="value" class="mono" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="4k7, 470R, 1M, 2.2 kΩ">
            </label>
            <p class="hint">Use k, M and G for thousands, millions and billions. R or a plain number means ohms; 4k7 is 4.7 kΩ.</p>
            <div class="grid-2">
              <label class="field">
                <span>Tolerance</span>
                <select id="tolerance"></select>
              </label>
              <label class="field" id="tempco-field" hidden>
                <span>Temperature coefficient</span>
                <select id="tempco"></select>
              </label>
            </div>
            <p class="msg" id="find-msg" role="status" aria-live="polite"></p>
          </div>
        </div>
      </div>

      <div class="pane">
        <div class="pane-head">
          <span class="pane-title">Result</span>
          <button class="btn sm" type="button" data-copy="#result">Copy</button>
        </div>
        <div class="pane-body">
          <div class="drawing" id="drawing"></div>
          <p class="result-value" id="result" role="status" aria-live="polite"></p>
          <dl class="kv" id="details"></dl>
          <p class="msg" id="status"></p>
        </div>
      </div>
    </section>
  </main>
  <div data-shell="footer"></div>
</body>
</html>
